image:
  pullSecrets:
    - name: dockerio

# Not a secret, backends are never exposed publicly.
forwardingSecret: "AsmMzWkjyrNvu5DprZWupQXy79mKFHK7d5Aj662YmVq4zEQns3RWb7NFpxvcTzgV"

# envsubst'd by the workflow, from vault prod/proxy.
cookieSecret: "${MAPMAKER_PROXY_COOKIE_SECRET}"

service:
  nodePort: 30565

nodeSelector:
  # Required: the service is externalTrafficPolicy Local, so only this node's nodePort answers, and
  # it is the node the SRV record points at.
  kubernetes.io/hostname: wkr-01

env:
  SESSION_SERVICE_URL: "http://api-server:9124"
  IPC_SERVICE_URL: "http://api-server-java:9124"
  ANTICHEAT_ENABLED: "true"

# The anticheat ring is always on per tapped connection (8 MiB cap each), so heap scales with
# player count rather than capture rate. Requests match limits for Guaranteed QoS, and the heap is
# -Xms3g -Xmx3g with AlwaysPreTouch, leaving ~2Gi for direct buffers, metaspace and stacks.
resources:
  limits:
    cpu: 1000m
    memory: 5Gi
  requests:
    cpu: 1000m
    memory: 5Gi
