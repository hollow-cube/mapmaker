apiVersion: v1
kind: Service
metadata:
  name: {{ include "mapmaker-proxy.fullname" . }}
  labels:
    {{- include "mapmaker-proxy.labels" . | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: 25565
      targetPort: minecraft
      protocol: TCP
      name: minecraft
      nodePort: {{ .Values.service.nodePort }}
  selector:
    {{- include "mapmaker-proxy.selectorLabels" . | nindent 4 }}
  # Only the node the pod is on answers on the nodePort; there is one such node, by nodeSelector.
  externalTrafficPolicy: Local
