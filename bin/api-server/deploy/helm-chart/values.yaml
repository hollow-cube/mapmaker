global:
  nameOverride: api-server-java
  fullnameOverride: api-server-java

# The anticheat trace store volume (templates/trace-store-pvc.yaml), mounted where
# ANTICHEAT_STORE_DIR defaults to. ReadWriteOnce, which ties the deployment to one replica: a
# second api-server pod on another node cannot attach it. Scaling out means RWX (none in the
# cluster today) or moving the blobs off the filesystem — decide then, not now.
traceStore:
  size: 300Gi

base:
  image:
    repository: mworzala/api-server-java

  # The vault role and the path the agent sidecar renders are both the service account's name, so
  # running as the Go api-server's service account is what gets this the same database credentials
  # without a second vault secret to keep in step. Nothing else is shared: the Deployment, the
  # Service and everything else this chart names are its own.
  serviceAccount:
    create: false
    name: api-server

  volumes:
    - name: traces
      persistentVolumeClaim:
        claimName: api-server-java-traces
  volumeMounts:
    - name: traces
      mountPath: /data/anticheat

  # The image is distroless and runs as 65532, while a freshly provisioned volume comes up
  # root:root, so without this the store cannot create its first directory. OnRootMismatch because
  # the default policy chowns the whole volume on every start, which 300Gi cannot afford.
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
