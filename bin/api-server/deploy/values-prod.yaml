base:
  cluster: "prod"
  imagePullSecrets:
    - name: dockerio

  replicaCount: 1

  # G1 sizes its heap against the container limit, so this is also the heap setting.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Nothing is exported yet, so there is nothing for a ServiceMonitor to scrape.
  service:
    monitor:
      enabled: false

  env:
    PORT: "9124"
    # The same broker the game servers publish and consume on; chat fans out over it.
    NATS_SERVERS: "nats://nats:4222"

  # The trace-store PVC is ReadWriteOnce, so the pod must come up on the node holding the volume
  # attach; pinning it is what keeps a rolling replacement from deadlocking on another node. Remove
  # when the store moves to RWX or off the filesystem — address it then.
  nodeSelector:
    kubernetes.io/hostname: wkr-01
