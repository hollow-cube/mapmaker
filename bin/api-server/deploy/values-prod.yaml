base:
  cluster: "prod"
  imagePullSecrets:
    - name: dockerio

  replicaCount: 1

  # G1 sizes its heap against the container limit, so this is also the heap setting.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Nothing is exported yet, so there is nothing for a ServiceMonitor to scrape.
  service:
    monitor:
      enabled: false

  env:
    PORT: "9124"
