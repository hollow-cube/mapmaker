base:
  cluster: "prod"
  imagePullSecrets:
    - name: dockerio

  # One is enough until there is work to share; more replicas share the nats queues and take the
  # schedules over from each other, they do not run them twice.
  replicaCount: 1

  # -XX:MaxRAMPercentage sizes the heap against the limit, so this is also the heap setting.
  # Indexing holds a whole decoded world, and the largest published maps run past a hundred
  # million blocks, which is half a gigabyte of sections before the map is even walked; with
  # four slots a backfill can have four of those in flight at once.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 4Gi

  service:
    monitor:
      enabled: false

  env:
    # The java api-server, where the ipc services are. Named rather than left to the default for
    # the same reason every other consumer names it: the chart is what says which cluster service
    # this talks to.
    IPC_SERVICE_URL: "http://api-server-java:9124"

    # How many replays the reconciler asks to compact per tick. Measured at ~830/min on four slots,
    # so this drains in about twelve of the fifteen minutes between ticks — the headroom is what
    # keeps index-map, which sorts behind compact-replay among queued rows, from being starved.
    REPLAY_BATCH: "10000"
